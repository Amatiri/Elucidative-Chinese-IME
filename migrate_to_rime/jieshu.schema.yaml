# Rime schema
# encoding: utf-8
# 解书音形 —— RIME 移植 Phase 1（单字最小可用）
# 真源：仓库 dict/dictionary.txt，经 migrate_to_rime/rime_export.py 导出为 jieshu.dict.yaml
# 注意：punctuator 不写 import_preset: default —— 本资料夹 default.yaml（万象定制）无 punctuator 段，
#       照抄会报 failed to include section default:punctuator（Phase 0 踩坑①）。

schema:
  schema_id: jieshu
  name: 解书音形
  version: "0.1"
  author:
    - Amatiri
  description: |
    解书音形：音形结合、零重码输入方案的 RIME 移植。Phase 1 单字严格模式。

switches:
  - name: ascii_mode
    states: [ 中文, 西文 ]

engine:
  processors:
    # P4-D 自动上字：必须排在 gate **之前** —— 它 select() 上屏后会 Clear() 输入流，
    # 当前按键要继续流到 gate，由 gate 按「空输入流」规则处置（小写字母放行、
    # 数字/大写/符号拦截穿透），这才等价于 ime.py「自动上字后输入框已清空」的状态。
    # 排在 gate 之后则 gate 已用清空前的输入判过一轮，当前键会被当成码字符推进空输入流。
    - lua_processor@*jieshu_autocommit
    # 第十一轮：gate 提到链首——ascii_composer 在西文模式下会于 composing 中
    # 直接 PushInput 并终止链，绕过检入；gate 领先后任何进输入流的字符必经检入，
    # 西文模式由 gate 内 get_option(ascii_mode) 判定后整体放行。
    - lua_processor@*jieshu_gate
    # P4-B 逐字定位：`=` 把光标跳到「第一个未确认段」末尾（逐字入口），
    # `-` 等同 Backspace（回退上一个已确认段重新出候选）。
    # 必须排在 key_binder 之前 —— 本机 default.yaml（万象）把 `-`/`=` 绑成了 Page_Up/Page_Down，
    # 排在后面就抢不到键；翻页仍可用 ↑↓（见 key_binder 段）。
    - lua_processor@*jieshu_nav
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*jieshu_query   # 第八轮定案：必须排 table 之前——RIME 同段候选由首个非空 translator 独占
    - table_translator               # 音节图宿主（供 matcher/abc 判定合法编码段）；候选由 filter 丢弃
  filters:
    - lua_filter@*jieshu_drop_native # 丢弃原生 table 候选（无余码、DP 乱链），兜底防泄漏
    # ⚠️ 不写 uniquifier：它按候选 text 去重，会把「同字不同码」的多音字条目吞掉。
    #    实测 `oo`：真源 7 条（哦4k/噢1k/哦2k/哦3k/嚄3kc/喔4ks/喔0k），去重后只剩 4 条，
    #    哦2k、哦3k、喔0k 消失 —— 与 ime.py 把多音字视作不同条目显示的做法相反。
    #    解书的「零重码」是码→字唯一，同字多读音是不同条目，必须逐条列出。
    #    前提：真源 8344 条中（字,码）完全重复为 0（2026-09-10 统计），
    #    故去掉去重不会产生真重复项；若日后码表整理出现完全重复行，
    #    需补一个按 text+comment 去重的 lua filter。

speller:
  # CODE_CHARS = 1234567890qwertyuiopasdfghjklzxcvbnm;'.
  # ' 不进 alphabet、只作 delimiter（真源 0 条码含 '，实证）；. 必须进（327 条补码）。
  # 不设 algebra：前缀匹配全部做成词典真实条目（jieshu.dict.yaml 前缀区），
  # derive 派生拼写会把短输入映射到多音节、按音节字典序合并（戈 ge17 抢个 ge41），已废弃。
  alphabet: "1234567890qwertyuiopasdfghjklzxcvbnm;."
  # 检入机制（对齐 ime.py:772）：输入流为空（光标处于段首）时，只有 26 个小写字母
  # 能唤起 composing；数字、; . ' 与大写字母一律不进 input，交给 punctuator /
  # express_editor 直接上屏（express_editor 的 DirectCommit 会 return kRejected，
  # 按键穿透到应用程序）。段中间（前一字符在 alphabet 内）不作限制，
  # 故码内数字/;/./' 与人工 ' 照常输入。
  # librime speller.cc：initials_ 为空时默认等于 alphabet_，故必须显式收窄。
  # 实证：真源 8336 条码全部以小写字母开头，无一条被误伤。
  initials: "abcdefghijklmnopqrstuvwxyz"
  delimiter: "'"
  auto_select: false

translator:
  dictionary: jieshu
  # 第九轮：本表仅作音节图宿主（prism 供 matcher/abc 判定合法段），
  # 候选队列里 lua_translator 排前；lua 无候选时 table 理论上可接盘，
  # 但词典前缀区与查询可见性规则同源（无候选⇒无条目），正常仍不产出，
  # 万一产出由 filter 丢弃。
  # 补全与句构双关：前者字典序污染 b→兵，后者 DP 乱链 bua→不痧。
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false      # 纪律红线：零重码禁调频
  contextual_suggestions: false

menu:
  page_size: 5                 # 对齐原前端 5 选
  # 选字键：解书编码含 0-9，数字进入 speller/alphabet 后被收编为码字符，
  # selector 收不到数字键（speller 先 PushInput 并 kAccepted 终止链），
  # 故沿用原前端的 Shift+1~5（!@#$%）选字。
  # 源码依据：selector.cc —— schema()->select_keys() 非空时只按该串取 index，
  # 不再走数字分支；该值由 Schema::FetchUsefulConfigItems() 读 menu/alternative_select_keys。
  # 小狼毫下 Shift+数字 传入的是符号本身 keycode（exclam/at/numbersign/dollar/percent），
  # 与雾凇 default.yaml「小狼毫 Control+Shift+dollar 生效」的注释一致。
  alternative_select_keys: "!@#$%"

punctuator:    #暂未实装
  half_shape:
    ",": "，"
    ".": "。" 
    ";": "；"
    ":": "："
    "`": "·"
    "[": "【"
    "]": "】"
    "/": "、"
    "<": "《"
    ">": "》"
    "?": "？"
    "(": "（"
    ")": "）"
    # 注意：! 与 $ 已从本表移除 —— punctuator 排在 selector 之前，
    # 若保留映射，composing 时 Shift+1/4 会被标点抢先上屏「！」「￥」，
    # 选字键永远轮不到 selector。空流下的符号由 gate 拦截后原样半角穿透，不受影响。
    "^": "……"
    "_": "——"
    "'": "‘’"
    '"': "“”"

# Shift 单击切换西文（官方默认 switch_key）——检入 gate 位于链首且在西文模式下
# 整体放行（get_option("ascii_mode")），ascii_composer 的切换与 push 不再破坏检入：
#   Shift 单击 → 西文模式 → gate 全放行 → 英文直通；切回中文 → gate 恢复检入。
# inline_ascii：composing 中触发时临时西文，上屏后自动退回中文（官方行为）。
ascii_composer:
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

key_binder:
  import_preset: default       # 本资料夹 default.yaml 有 key_binder 段，可安全导入（P3 专项再调键位）
  bindings:
    # 对齐原前端：↑↓ 翻页（selector 默认 ↑↓ 是逐条移高亮；保留 Prior/Next 翻页不受影响）
    - { when: has_menu, accept: Up, send: Page_Up }
    - { when: has_menu, accept: Down, send: Page_Down }

recognizer:
  # ⚠️ 不写 import_preset: default —— 本资料夹 default.yaml（万象定制）的 recognizer 段
  # 带 email / url / underscore 三个 pattern，会劫持 @ : / _ . 等符号：
  #   recognizer.cc: input += ch; if (match) { ctx->PushInput(ch); return kAccepted; }
  # Recognizer 排在 selector 之前，命中即吞键终止链，selector 永远收不到按键 ——
  # 实测表现为「Shift+2 打出 @ 而不选字」（@ 命中 email pattern；! # $ % 无 pattern 故正常）。
  # 解书编码字符集不含这些符号，该段对本方案完全无用，只保留自有的 jieshu pattern。
  patterns:
    # 码域整段（含手动 ' 分段）打 jieshu tag，供 lua_translator 接管时判定
    jieshu: "^[1234567890qwertyuiopasdfghjklzxcvbnm;'.]+$"
