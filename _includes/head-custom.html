<!-- 站点化 A 方案：覆盖主题的 _includes/head-custom.html。
     只作用于 Jekyll 主题渲染的 README 页（目前是 /mobile/）；
     自写的 index.html / help/index.html / migrate_to_rime/index.html 不走这个钩子。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='3' fill='none' stroke='%23b33a2e' stroke-width='3'/%3E%3Crect x='12' y='12' width='40' height='40' fill='none' stroke='%23b33a2e' stroke-width='1.5'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f7f2e9">
<style>
  /* ========== 与官网一致的基线 ========== */
  :root {
    --paper: #f7f2e9;
    --paper-deep: #efe7da;
    --paper-lite: #fdfaf4;
    --ink: #2c241e;
    --ink-soft: #5a4e44;
    --ink-faint: #8a7d70;
    --cinnabar: #b33a2e;
    --cinnabar-soft: rgba(179, 58, 46, 0.08);
    --gold: #a8894a;
    --line: rgba(90, 78, 68, 0.14);
    --line-strong: rgba(90, 78, 68, 0.26);
    --font-title: "KaiTi", "STKaiti", "Kaiti SC", "Songti SC", "SimSun", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", serif;
    --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif;
    --font-mono: "Courier New", "SFMono-Regular", Consolas, monospace;
  }

  html { scroll-behavior: smooth; }
  html.js body { padding-top: 56px; }

  body {
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.45;
    background-image:
      repeating-linear-gradient(90deg,
        transparent 0px, transparent 3px,
        rgba(160, 140, 110, 0.035) 3px, rgba(160, 140, 110, 0.035) 4px),
      repeating-linear-gradient(0deg,
        transparent 0px, transparent 5px,
        rgba(160, 140, 110, 0.018) 5px, rgba(160, 140, 110, 0.018) 6px),
      radial-gradient(ellipse at 20% 10%, rgba(200, 175, 135, 0.10), transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(180, 150, 120, 0.08), transparent 50%);
  }

  :where(a, button, [tabindex], summary):focus-visible {
    outline: 2px solid var(--cinnabar);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ========== 正文容器：保留主题的单栏与表格横向滚动 ========== */
  .container-lg.markdown-body {
    position: relative;
    z-index: 1;
    max-width: 1012px;
    margin-top: 0;
    margin-bottom: 0;
    padding: 44px 32px 90px;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-soft);
    background: transparent;
  }

  /* 主题自动加在项目名上的第一个 h1，降级为面包屑 */
  .markdown-body > h1:first-child {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    border: none;
    padding: 0;
    margin: 0 0 26px;
  }
  .markdown-body > h1:first-child a { color: var(--cinnabar); border: none; text-decoration: none; }

  .markdown-body h1:not(:first-child) {
    font-family: var(--font-title);
    font-size: clamp(34px, 4vw, 46px);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: 0.05em;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin: 0 0 30px;
  }
  .markdown-body h2 {
    font-family: var(--font-title);
    font-size: clamp(25px, 2.8vw, 30px);
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-top: 56px;
    scroll-margin-top: 76px;
  }
  .markdown-body h3 {
    font-family: var(--font-title);
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--ink);
    border-left: 2px solid var(--cinnabar);
    padding-left: 12px;
    scroll-margin-top: 76px;
  }
  .markdown-body h4 {
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .markdown-body p, .markdown-body ul, .markdown-body ol { color: var(--ink-soft); }
  .markdown-body strong { color: var(--ink); }

  .markdown-body a {
    color: var(--cinnabar);
    text-decoration: none;
    border-bottom: 1px solid rgba(179, 58, 46, 0.30);
  }
  .markdown-body a:hover { border-bottom-color: var(--cinnabar); }
  .markdown-body hr { height: 1px; background: var(--line); border: 0; }
  .markdown-body blockquote {
    border-left: 2px solid var(--gold);
    background: rgba(168, 137, 74, 0.06);
    color: var(--ink-soft);
    padding: 10px 20px;
  }

  /* ========== 代码与表格 ========== */
  .markdown-body code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    padding: 1px 6px;
    border-radius: 2px;
    background: var(--cinnabar-soft);
    color: var(--cinnabar);
  }
  /* 主题用 .markdown-body .highlight pre 压背景，这里用同特异性覆盖 */
  .markdown-body .highlight {
    background: var(--paper-lite);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .markdown-body .highlight pre, .markdown-body pre {
    background: transparent;
    padding: 16px 18px;
    overflow-x: auto;
    border: none;
  }
  .markdown-body pre code {
    background: none;
    color: var(--ink);
    padding: 0;
    font-size: 13.5px;
    line-height: 1.75;
  }
  .markdown-body table {
    display: block;
    width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .markdown-body table th {
    background: var(--paper-deep);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    white-space: nowrap;
  }
  .markdown-body table td { border: 1px solid var(--line); color: var(--ink-soft); }
  .markdown-body table tr { background: rgba(255, 253, 249, 0.55); border-top: none; }
  .markdown-body table tr:nth-child(2n) { background: rgba(255, 253, 249, 0.28); }
  .markdown-body img { background: transparent; }

  /* ========== 主题页脚 ========== */
  .markdown-body .footer {
    border-top: 1px solid var(--line);
    color: var(--ink-faint);
    font-size: 12.5px;
    text-align: left;
    margin-top: 48px;
    padding-top: 18px;
  }
  .markdown-body .footer a { color: var(--ink-soft); }

  /* ========== 站点导航条（由下方脚本注入，无 JS 时不出现） ========== */
  .site-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 32px;
    background: rgba(247, 242, 233, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    font-family: var(--font-body);
    font-size: 13.5px;
  }
  .site-bar .brand {
    flex: none;
    font-family: var(--font-title);
    font-size: 19px;
    letter-spacing: 0.16em;
    color: var(--ink);
    text-decoration: none;
    border: none;
  }
  .site-bar .brand span { color: var(--cinnabar); }
  .site-bar nav {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-left: auto;
    overflow-x: auto;
    scrollbar-width: none;
    white-space: nowrap;
  }
  .site-bar nav::-webkit-scrollbar { display: none; }
  .site-bar nav a {
    color: var(--ink-soft);
    text-decoration: none;
    border: none;
  }
  .site-bar nav a:hover { color: var(--cinnabar); }
  .site-toc-wrap { flex: none; position: relative; }
  .site-toc-wrap > summary {
    list-style: none;
    cursor: pointer;
    padding: 4px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    color: var(--ink-soft);
    background: rgba(255, 253, 249, 0.6);
    user-select: none;
  }
  .site-toc-wrap > summary::-webkit-details-marker { display: none; }
  .site-toc-wrap > summary::after { content: " ▾"; color: var(--cinnabar); }
  .site-toc-wrap[open] > summary::after { content: " ▴"; }
  .site-toc {
    position: absolute;
    top: 34px; right: 0;
    width: 230px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 10px 0;
    background: var(--paper-lite);
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    box-shadow: 0 18px 40px -22px rgba(44, 36, 30, 0.5);
  }
  .site-toc a {
    display: block;
    padding: 5px 16px;
    color: var(--ink-soft);
    text-decoration: none;
    border: none;
    font-size: 13px;
  }
  .site-toc a:hover { color: var(--cinnabar); background: var(--cinnabar-soft); }

  @media (max-width: 760px) {
    .container-lg.markdown-body { padding: 32px 22px 70px; }
    .site-bar { padding: 0 18px; gap: 10px; }
    .site-bar .brand { font-size: 17px; }
    .site-bar nav { gap: 12px; font-size: 12px; }
    /* 窄屏收起两个次要外链，其余入口在官网与自写页里都有 */
    .site-bar nav a:nth-child(4),
    .site-bar nav a:nth-child(5) { display: none; }
    .site-toc { width: 200px; right: -6px; }
    .markdown-body h2 { margin-top: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
<script>
(function () {
  'use strict';
  /* head-custom 注入在 <head>，此时 body 尚未解析，必须等 DOMContentLoaded */
  function init() {
    if (!document.querySelector('.markdown-body')) return;

    var root = document.documentElement;
    root.classList.add('js');
    /* 主题 layout 把 lang 写死为 en-US，运行时改回中文；静态源码仍是 en-US */
    root.lang = 'zh-CN';

    var BASE = 'https://amatiri.github.io/Elucidative-Chinese-IME/';
    var bar = document.createElement('div');
    bar.className = 'site-bar';
    bar.innerHTML =
      '<a class="brand" href="' + BASE + '">解书音形<span>.</span></a>' +
      '<nav>' +
        '<a href="' + BASE + '">官网</a>' +
        '<a href="' + BASE + 'help/">编码规则</a>' +
        '<a href="' + BASE + 'migrate_to_rime/">Rime 部署</a>' +
        '<a href="https://frontend-mobile.netlify.app/">手机端演示</a>' +
        '<a href="https://github.com/Amatiri/Elucidative-Chinese-IME">GitHub ↗</a>' +
      '</nav>' +
      '<details class="site-toc-wrap"><summary>目录</summary><div class="site-toc"></div></details>';
    document.body.insertBefore(bar, document.body.firstChild);

    var toc = bar.querySelector('.site-toc');
    var headings = document.querySelectorAll('.markdown-body h2[id]');
    Array.prototype.forEach.call(headings, function (h) {
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/\s+/g, ' ').trim();
      toc.appendChild(a);
    });
    if (!toc.children.length) {
      bar.querySelector('.site-toc-wrap').hidden = true;
    }
    var details = bar.querySelector('details');
    toc.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') details.open = false;
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
